[project]
name = "milo-app"
version = "0.1.0"
description = "MILO desktop app: a live Neo4j graph of BIOVIA sim bundles"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mcp>=2.2,<3",
    "neo4j>=5.20",
    "numpy>=2.5.3",
    "PySide6>=6.7",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
milo-app = "milo_app.__main__:main"
milo-mcp = "milo_app.mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milo_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
